<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 영어 동아리 실시간 현황판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // 환경 변수 설정 (시스템에서 제공)
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'english-study-club';
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 상태 관리
        let studyData = {};
        const members = ["이성미", "황경혜", "김윤희", "백가희"];

        // 인증 및 데이터 리스너
        async function init() {
            await signInAnonymously(auth);
            
            // 실시간 데이터 구독
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'progress');
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    studyData = docSnap.data();
                } else {
                    // 초기 데이터 구조 생성
                    members.forEach(m => { studyData[m] = []; });
                }
                render();
            }, (error) => console.error("데이터 로드 실패:", error));
        }

        // 화면 그리기 함수
        function render() {
            const container = document.getElementById('members-container');
            container.innerHTML = '';
            
            members.forEach(name => {
                const data = studyData[name] || [];
                const filledCount = data.length;
                
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl border-2 border-pink-200 shadow-lg hover:shadow-xl transition-shadow";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-xl text-rose-700">🌸 ${name}</span>
                            <span class="text-sm font-bold ${filledCount === 15 ? 'bg-gradient-to-r from-pink-400 to-rose-400 text-white' : 'bg-gradient-to-r from-green-100 to-lime-100 text-green-700'} px-3 py-1.5 rounded-full shadow-sm">
                                ${filledCount === 15 ? '🎉 완주!' : filledCount + '/15 완료'}
                            </span>
                        </div>
                    </div>
                    <div class="w-full bg-gradient-to-r from-pink-100 to-yellow-100 h-3 rounded-full mb-5 overflow-hidden shadow-inner">
                        <div class="bg-gradient-to-r from-pink-400 via-rose-400 to-yellow-400 h-full transition-all duration-500 rounded-full" style="width: ${(filledCount / 15) * 100}%"></div>
                    </div>
                    <div class="grid grid-cols-5 gap-3">
                        ${Array.from({length: 15}).map((_, i) => {
                            const dateValue = data[i] || '';
                            const isFilled = !!dateValue;
                            return `
                                <div onclick="window.toggleSlot('${name}', ${i})" 
                                     class="h-14 flex flex-col items-center justify-center border-2 rounded-xl cursor-pointer transition-all text-xs font-bold shadow-sm
                                     ${isFilled 
                                         ? 'bg-gradient-to-br from-pink-400 to-rose-400 border-pink-500 text-white shadow-md transform scale-105' 
                                         : 'bg-gradient-to-br from-white to-pink-50 border-pink-200 text-pink-300 hover:border-pink-400 hover:shadow-md hover:scale-105'}">
                                    ${isFilled 
                                        ? `<span class="text-[10px] opacity-80">✓</span><span class="text-[9px] mt-0.5">${dateValue}</span>` 
                                        : `<span class="text-lg">${i + 1}</span>`}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 클릭 시 데이터 업데이트
        window.toggleSlot = async (name, index) => {
            const currentData = [...(studyData[name] || [])];
            
            if (currentData[index]) {
                if (confirm("기록을 삭제할까요?")) {
                    currentData.splice(index, 1);
                }
            } else {
                const now = new Date();
                const dateStr = `${now.getMonth() + 1}/${now.getDate()}`;
                currentData.push(dateStr);
            }

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'progress');
            await setDoc(docRef, { ...studyData, [name]: currentData });
        };

        window.onload = init;
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #fef3f5 0%, #fff9e6 50%, #f0fdf4 100%);
            min-height: 100vh;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto space-y-8">
        <!-- 헤더 -->
        <div class="bg-gradient-to-r from-pink-400 via-rose-400 to-yellow-400 p-8 rounded-3xl text-white text-center shadow-2xl border-4 border-white">
            <div class="float-animation inline-block mb-3">
                <span class="text-5xl">🌸</span>
            </div>
            <h1 class="text-3xl font-bold mb-3 drop-shadow-lg">2026 영어 동아리 성장 기록부</h1>
            <p class="text-pink-50 text-sm font-medium">봄처럼 피어나는 우리의 성장, 함께 기록해요! 🌷</p>
        </div>

        <!-- 멤버 카드 -->
        <div id="members-container" class="space-y-6">
            <!-- 실시간 데이터 로드 중... -->
            <div class="text-center py-20">
                <div class="inline-block animate-spin text-4xl mb-4">🌼</div>
                <p class="text-rose-400 font-medium">데이터를 불러오고 있습니다...</p>
            </div>
        </div>

        <!-- 안내 -->
        <div class="bg-gradient-to-br from-green-50 to-lime-50 border-2 border-green-200 p-6 rounded-2xl text-sm text-green-800 shadow-lg">
            <h3 class="font-bold text-base mb-3 text-green-700">📝 사용 방법</h3>
            <ul class="space-y-2">
                <li class="flex items-start gap-2">
                    <span class="text-green-500 font-bold">✓</span>
                    <span><b>기록 방법:</b> 자신의 이름 아래 숫자를 누르면 오늘 날짜가 찍힙니다.</span>
                </li>
                <li class="flex items-start gap-2">
                    <span class="text-green-500 font-bold">✓</span>
                    <span><b>삭제 방법:</b> 입력된 날짜를 다시 누르면 삭제할 수 있습니다.</span>
                </li>
                <li class="flex items-start gap-2">
                    <span class="text-rose-500 font-bold">⚠</span>
                    <span><b>주의:</b> 다른 사람의 칸은 실수로 누르지 않도록 주의해주세요!</span>
                </li>
            </ul>
        </div>

        <!-- 푸터 -->
        <div class="text-center text-pink-400 text-sm py-4">
            <p>🌺 함께 성장하는 우리, 파이팅! 🌺</p>
        </div>
    </div>
</body>
</html>
