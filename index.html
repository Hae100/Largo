<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 영어 동아리 실시간 현황판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAuRA-kNCfwiIxtbMz_moVtA-7Jm1sAYpE",
            authDomain: "largo-2026.firebaseapp.com",
            projectId: "largo-2026",
            storageBucket: "largo-2026.firebasestorage.app",
            messagingSenderId: "598325400796",
            appId: "1:598325400796:web:aa773b6c98bed4a4141019"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let studyData = {};
        const members = ["이성미", "황경혜", "김윤희", "백가희"];

        async function init() {
            try {
                await signInAnonymously(auth);
                const docRef = doc(db, 'club-progress', 'data');
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        studyData = docSnap.data();
                    } else {
                        studyData = {};
                        members.forEach(m => { studyData[m] = []; });
                        setDoc(docRef, studyData);
                    }
                    render();
                });
            } catch (error) {
                console.error("초기화 실패:", error);
            }
        }

        function render() {
            const container = document.getElementById('members-container');
            container.innerHTML = '';
            
            members.forEach(name => {
                const data = studyData[name] || [];
                const filledCount = data.length;
                
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all duration-300";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-5">
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-lg text-slate-700">${name}</span>
                            <span class="text-[11px] font-semibold ${filledCount === 15 ? 'bg-blue-100 text-blue-600' : 'bg-slate-100 text-slate-500'} px-2.5 py-1 rounded-md uppercase tracking-wider">
                                ${filledCount === 15 ? 'Completed' : filledCount + ' / 15'}
                            </span>
                        </div>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full mb-6 overflow-hidden">
                        <div class="bg-blue-300 h-full transition-all duration-700 ease-out rounded-full" style="width: ${(filledCount / 15) * 100}%"></div>
                    </div>
                    <div class="grid grid-cols-5 gap-2.5">
                        ${Array.from({length: 15}).map((_, i) => {
                            const dateValue = data[i] || '';
                            const isFilled = !!dateValue;
                            return `
                                <div onclick="toggleSlot('${name}', ${i})" 
                                     class="h-12 flex flex-col items-center justify-center border rounded-lg cursor-pointer transition-all duration-200 text-xs
                                     ${isFilled 
                                         ? 'bg-blue-50 border-blue-200 text-blue-500 font-bold' 
                                         : 'bg-white border-slate-100 text-slate-300 hover:border-blue-200 hover:bg-slate-50'}">
                                    ${isFilled 
                                        ? `<span class="text-[10px] font-medium">${dateValue}</span>` 
                                        : `<span>${i + 1}</span>`}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.toggleSlot = async (name, index) => {
            const currentData = [...(studyData[name] || [])];
            if (currentData[index]) {
                if (confirm("기록을 삭제할까요?")) {
                    currentData.splice(index, 1);
                }
            } else {
                const now = new Date();
                const dateStr = `${now.getMonth() + 1}.${now.getDate()}`;
                currentData.push(dateStr);
            }
            const docRef = doc(db, 'club-progress', 'data');
            await setDoc(docRef, { ...studyData, [name]: currentData });
        };

        window.onload = init;
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { 
            font-family: 'Inter', 'Pretendard', sans-serif; 
            background-color: #f8fafc;
            color: #334155;
        }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-4xl mx-auto space-y-10">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">2026 English Club</h1>
            <p class="text-slate-400 text-sm">성장 기록을 실시간으로 확인하세요.</p>
        </div>

        <div id="members-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-full text-center py-20 text-slate-400 text-sm">
                데이터를 연결 중입니다...
            </div>
        </div>

        <div class="bg-white border border-slate-100 p-6 rounded-2xl shadow-sm">
            <h3 class="font-semibold text-sm mb-3 text-slate-700 italic">Guide</h3>
            <ul class="text-xs text-slate-500 space-y-1.5">
                <li>• 숫자를 클릭하면 오늘 날짜가 기록됩니다.</li>
                <li>• 기록된 날짜를 클릭하면 삭제할 수 있습니다.</li>
            </ul>
        </div>

        <div class="text-center text-slate-300 text-[10px] uppercase tracking-widest">
            © 2026 Largo English Club
        </div>
    </div>
</body>
</html>
